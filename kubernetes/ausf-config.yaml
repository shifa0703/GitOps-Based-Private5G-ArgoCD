apiVersion: v1
kind: ConfigMap
metadata:
  name: ausf-config
  namespace: open5gs

data:
  ausf.yaml: |
    logger:
      file: /opt/open5gs/var/log/open5gs/ausf.log

    global:

    ausf:
      sbi:
        server:
          - dev: eth0
            port: 7777

        client:
          nrf:
            - uri: http://nrf:7777
