apiVersion: v1
kind: ConfigMap
metadata:
  name: ueransim-startup
  namespace: open5gs
data:
  start-gnb.sh: |
    #!/bin/bash

    IP=$(hostname -i)

    sed -i "s/linkIp:.*/linkIp: ${IP}/" /opt/UERANSIM/config/open5gs-gnb.yaml
    sed -i "s/ngapIp:.*/ngapIp: ${IP}/" /opt/UERANSIM/config/open5gs-gnb.yaml
    sed -i "s/gtpIp:.*/gtpIp: ${IP}/" /opt/UERANSIM/config/open5gs-gnb.yaml
    sed -i "s/address:.*/address: amf/" /opt/UERANSIM/config/open5gs-gnb.yaml

    cd /opt/UERANSIM

    ./build/nr-gnb -c config/open5gs-gnb.yaml

  start-ue.sh: |
    #!/bin/bash

    cd /opt/UERANSIM

    cp /opt/UERANSIM/config/open5gs-ue.yaml /tmp/open5gs-ue.yaml

    echo "Using gNB Service: ueransim-gnb"

    sed -i '/gnbSearchList:/,/uacAic:/ s/^[[:space:]]*- .*/  - ueransim-gnb/' /tmp/open5gs-ue.yaml

    echo "Starting UERANSIM UE..."
    ./build/nr-ue -c /tmp/open5gs-ue.yaml
